[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envscope"
version = "0.1.0"
description = "Audit .env files against .env.example and a JSON schema without printing secrets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicola Rebecca" }]
keywords = ["dotenv", "env", "configuration", "cli", "devops", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
envscope = "envscope.cli:main"

[project.urls]
Homepage = "https://github.com/NicolaRebecca/envscope"
Issues = "https://github.com/NicolaRebecca/envscope/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
